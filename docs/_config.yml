title: GPTCode
description: Open-source coding agent for repository-native, multi-model workflows with executable verification.
baseurl: ""
url: "https://gptcode.dev"
lang: en
locale: en_US
logo: /assets/gptcode.png

author:
  name: Jader Correa
  url: https://jader-correa.com

social:
  name: Jader Correa
  links:
    - https://github.com/jadercorrea
    - https://www.linkedin.com/in/jadercorrea

# theme: minima  # Disabled - using custom Tokyo Night CSS

permalink: /blog/:year-:month-:day-:title

collections:
  posts:
    output: true
    permalink: /blog/:year-:month-:day-:title
  skills:
    output: true
    permalink: /skills/:name

markdown: kramdown
highlighter: rouge

timezone: America/Sao_Paulo
future: false

google_analytics: G-YRR7YKV1NG

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Server configuration
port: 4040

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "skills"
    values:
      layout: "skill"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - install.sh
  - install_nvim_plugin.sh
  - test
