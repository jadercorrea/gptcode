name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build CLI for tests
        run: |
          go build -o "$RUNNER_TEMP/gptcode" ./cmd/gptcode
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run test suite
        run: go test -v -short ./...

      - name: Verify public examples
        run: scripts/verify-public-examples.sh

      - name: Publish GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
